[project]
name = "gestion-satisfactory-backend"
version = "0.1.0"
description = "FastAPI backend for Satisfactory planner and optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.43",
  "alembic>=1.16.5",
  "pydantic>=2.11.9",
  "pydantic-settings>=2.11.0",
  "python-dotenv>=1.1.1",
  "pulp>=3.2.2",
  "beautifulsoup4>=4.14.2",
  "requests>=2.32.5",
  "pandas>=2.3.3",
  "numpy>=2.3.3",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "httpx>=0.28.1",
  "ruff>=0.13.0",
  "mypy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
