services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: satisfactory_backend
    environment:
      API_PORT: ${API_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/sqlite/satisfactory.db}
      EXPOSE_TRACEBACKS: ${EXPOSE_TRACEBACKS:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./static:/app/static
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: satisfactory_frontend
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
